upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_name localhost _;

    # Limitation de la taille des requêtes (ex: uploads KYC 15 Mo)
    client_max_body_size 15M;

    # Headers de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fichiers statiques Django
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Médias utilisateur (ex: KYC)
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # Proxy vers l'application Django Gunicorn
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Défi Certbot Let's Encrypt (pour renouvellement SSL automatique)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
